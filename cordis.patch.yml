# dsh-local-opencode bundle layer.
#
# `dsh plugin --profile <name> add dsh-local-opencode` appends this layer to the
# profile's `dsh.profile.bundles`. It inserts ONE row that mounts the plugin with
# its shipped defaults. `name` must be the real package name: cordis imports the
# plugin by that string, so a wrong value surfaces as "Cannot find package".
# Override any field from the profile's own `cordis.patch.yml` (a patch replaces
# the whole `config`, so restate every key you keep):
#
#   - id: local-opencode
#     config:
#       enabled: true
#       includePaid:
#         githubCopilot: false
#         others: false
#       refreshMinutes: 30
#       requestTimeoutMs: 180000
#
# Nothing here is a secret: the plugin reads the local opencode server's own
# registration file (~/.local/state/opencode/service.json) at runtime, or the
# OPENCODE_SERVER_URL / OPENCODE_SERVER_PASSWORD environment overrides.
- insert:
    - id: local-opencode
      name: dsh-local-opencode
      config:
        enabled: true
